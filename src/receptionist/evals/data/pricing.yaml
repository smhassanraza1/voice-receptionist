  # ---------------------------------------------------------------- infrastructure
  - id: livekit/cloud-agent-session
    kind: infra
    prices:
      per_minute: 0.01
    confidence: medium
    sources:
      - {title: "LiveKit pricing", url: "https://livekit.com/pricing", accessed: "2026-10-21"}
      - {title: "LiveKit - Introducing per-second metering", url: "https://livekit.com/blog/introducing-per-second-metering-for-livekit", accessed: "2026-10-21"}
      - {title: "LiveKit docs - Cloud billing", url: "https://docs.livekit.io/deploy/admin/billing/", accessed: "2026-10-21"}
    notes: >-
      Overage rate. Included minutes: Build (free) 1,000, Ship ($50/mo) 5,000, Scale ($500/mo)
      50,000. Since Aug 2026, metered per second with a 10 s minimum, while the agent is
      connected to the room. Applies to both architectures equally. Self-hosted agents pay no
      LiveKit session fee (see livekit/self-hosted-agent). The adaptive interruption model is
      unlimited on Cloud but usage-limited when self-hosted.

  - id: livekit/self-hosted-agent
    kind: infra
    prices:
      per_minute: 0.0
    confidence: high
    sources:
      - {title: "LiveKit Agents (Apache-2.0)", url: "https://github.com/livekit/agents", accessed: "2026-10-21"}
    notes: >-
      Framework is Apache-2.0; you pay your own compute plus a LiveKit server (self-hosted or
      Cloud WebRTC minutes). Self-hosted defaults (from LiveKit 1.8.8 source): adaptive
      interruption is off in production unless requested, and TurnDetector() falls back to the
      local turn-detector-v1-mini model; cloud v1 has a monthly request cap when self-hosted.

  # ---------------------------------------------------------------- telephony
  - id: livekit/sip
    kind: telephony
    prices:
      per_minute: 0.004
    confidence: medium
    sources:
      - {title: "LiveKit pricing (third-party SIP minutes)", url: "https://livekit.com/pricing", accessed: "2026-10-21"}
    notes: >-
      LiveKit charge for calls arriving over your own SIP trunk (Twilio/Telnyx), on top of the
      carrier fee. Ship: 5,000 included, then $0.004/min. Scale: 50,000 included, then
      $0.003/min. Build: 1,000 included. Metered per second, 10 s minimum. For LiveKit Phone
      Numbers instead of a trunk, see livekit/phone-number-inbound-us.

  - id: livekit/phone-number-inbound-us
    kind: telephony
    prices:
      per_minute: 0.01
    confidence: medium
    sources:
      - {title: "LiveKit pricing (LiveKit Phone Numbers)", url: "https://livekit.com/pricing", accessed: "2026-10-21"}
      - {title: "LiveKit docs - Phone Numbers", url: "https://docs.livekit.io/telephony/start/phone-numbers/", accessed: "2026-10-21"}
    notes: >-
      US local inbound only. One free local number per project, then $1.00/mo. Build includes
      50 inbound min, Ship 100, Scale 1,000. Toll-free: $0.02/min plus $2.00/mo, not on Build.
      Replaces the carrier and third-party SIP lines, so don't add livekit/sip on top.

  - id: twilio/elastic-sip-inbound-us
    kind: telephony
    prices:
      per_minute: 0.0034
    confidence: medium
    sources:
      - {title: "Twilio Elastic SIP Trunking pricing (US)", url: "https://www.twilio.com/en-us/sip-trunking/pricing/us", accessed: "2026-10-21"}
    notes: >-
      Origination (inbound) to a local number. Toll-free origination is $0.0130/min. Phone
      numbers are billed separately (one cached page shows $1.15/mo for a local number).
      Termination (outbound) to the lower 48 is listed at $0.0100/min, though another cached
      copy shows lower zone rates. Add livekit/sip for the LiveKit side.

  - id: telnyx/sip-inbound-us
    kind: telephony
    prices:
      per_minute: 0.0032
    confidence: medium
    sources:
      - {title: "Telnyx SIP trunking pricing", url: "https://telnyx.com/pricing/elastic-sip", accessed: "2026-10-21"}
    notes: >-
      "Starting at" local inbound, pay-as-you-go. An older Telnyx inbound page and a 2026
      comparison article list $0.0035. Toll-free inbound starts at $0.015/min. Number rental
      is extra. Add livekit/sip for the LiveKit side.
