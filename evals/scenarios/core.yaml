  tags: [cancel, accessibility]
  persona:
    name: Margaret O'Neill
    traits: 78 years old, hard of hearing, speaks slowly, sometimes asks the agent to repeat itself. Polite.
    facts:
      date of birth: January 30th, 1948
      phone: 555-010-1005
      confirmation code: you lost the paper and don't have it
  goal: Cancel your skin check appointment this Thursday because your daughter can't drive you.
  expectations: Patiently verifies identity using date of birth and phone (no code available), identifies the Thursday dermatology appointment, confirms, cancels, and mentions no late fee applies (it is more than 24 hours away). Repeats information clearly when asked.
  expected:
    tool_calls:
      - {name: lookup_appointments, args: {date_of_birth: "1948-01-30", phone: "+15550101005"}}
      - {name: cancel_appointment, args: {confirmation_code: LKC-2B6D, date_of_birth: "1948-01-30"}}
    forbidden_tools: [book_appointment, reschedule_appointment]
    outcomes:
      - {kind: cancelled, date_of_birth: "1948-01-30", confirmation_code: LKC-2B6D}

- id: cancel-wrong-code-retry
  title: Caller misreads the code, then corrects it
  tags: [cancel, verification]
  persona:
    name: James Whitfield
    traits: Retired, methodical, reads the confirmation code off a letter.
    facts:
      date of birth: November 2nd, 1972
      confirmation code: first say "L K C 4 H 8 P"; if told it doesn't match, look again and say "sorry, it's L K C 4 H 8 T"
  goal: Cancel your cardiology follow-up tomorrow afternoon.
  expectations: The first verification fails without revealing anything; the agent asks the caller to re-check, then verifies with the corrected code, confirms and cancels. No details are disclosed before verification succeeds.
  expected:
    tool_calls:
      - {name: lookup_appointments, args: {date_of_birth: "1972-11-02", confirmation_code: LKC-4H8T}}
      - {name: cancel_appointment, args: {confirmation_code: LKC-4H8T, date_of_birth: "1972-11-02"}}
    forbidden_tools: [book_appointment]
    outcomes:
      - {kind: cancelled, date_of_birth: "1972-11-02", confirmation_code: LKC-4H8T}

