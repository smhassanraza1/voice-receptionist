- id: new-patient-dermatology
  title: New patient books the first dermatology slot next week
  tags: [booking, happy-path]
  persona:
    name: Daniel Brooks
    traits: Busy software engineer calling between meetings. Terse, answers only what is asked.
    facts:
      date of birth: June 2nd, 1990
      phone: 555-010-2020
  goal: Book the earliest available dermatology appointment next week for a mole check. Any time of day works. You have never been to this clinic.
  expectations: Finds dermatology availability, offers a couple of options, collects full name, date of birth and phone, reads the details back and gets a yes before booking, then gives the confirmation code clearly.
  expected:
    tool_calls:
      - {name: find_available_slots, args: {specialty: dermatology}}
      - {name: book_appointment, args: {patient_name: Daniel Brooks, date_of_birth: "1990-06-02", phone: "+15550102020"}}
    forbidden_tools: [cancel_appointment, reschedule_appointment]
    outcomes:
      - {kind: booked, date_of_birth: "1990-06-02", phone: "+15550102020", specialty: dermatology}

